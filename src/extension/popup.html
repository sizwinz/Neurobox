<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neurobox RPC</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Neurobox RPC</h1>
        <label class="switch">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </header>
      <section>
        <div class="status">
          <span id="dot" class="dot"></span>
          <span id="statusText">Checking...</span>
        </div>
        <h2 id="title">No media detected</h2>
        <p id="author"></p>
        <p id="time"></p>
        <p id="pageStatus"></p>
        <p id="error"></p>
        <form id="callbackForm" class="callback">
          <input id="callbackUrl" type="url" placeholder="Paste Discord callback URL">
          <button id="callbackSubmit" type="submit">Finish</button>
        </form>
        <div class="siteControls" aria-label="Site presence controls">
          <label class="check">
            <input id="youtubeEnabled" type="checkbox">
            <span>YouTube</span>
          </label>
          <label class="check">
            <input id="soundcloudEnabled" type="checkbox">
            <span>SoundCloud</span>
          </label>
          <label class="check">
            <input id="showUrlEnabled" type="checkbox">
            <span>Show URL</span>
          </label>
          <label class="check">
            <input id="showYoutubeChannelEnabled" type="checkbox">
            <span>YT Channel</span>
          </label>
        </div>
        <div id="domainSection" style="margin-top: 10px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.1);">
          <button id="toggleWhitelist" type="button" class="secondary full">Enable RPC on Current Site</button>
          <p id="domainStatus" style="font-size: 12px; margin-top: 5px; opacity: 0.8; text-align: center;"></p>
        </div>
        <div id="overrideSection" style="margin-top: 10px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.1);">
          <h3 style="font-size: 13px; margin-bottom: 5px;">Customize Media Info</h3>
          <select id="actionWordingSelect" style="width: 100%; margin-bottom: 5px; padding: 5px; box-sizing: border-box; background: #222; color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;">
            <option value="Auto">Status Wording: Auto</option>
            <option value="Watching">Status Wording: Watching</option>
            <option value="Listening">Status Wording: Listening to</option>
            <option value="Browsing">Status Wording: Browsing</option>
            <option value="Idling">Status Wording: Idling on</option>
            <option value="None">Status Wording: None</option>
          </select>
          <input id="overrideTitle" type="text" placeholder="Custom Title" style="width: 100%; margin-bottom: 5px; padding: 5px; box-sizing: border-box;">
          <input id="overrideImage" type="url" placeholder="Custom Poster URL" style="width: 100%; margin-bottom: 5px; padding: 5px; box-sizing: border-box;">
          <input id="overrideUrl" type="url" placeholder="Custom Target URL (https://...)" style="width: 100%; margin-bottom: 5px; padding: 5px; box-sizing: border-box;">
          <input id="overridePlatform" type="text" placeholder="Custom Platform (e.g. Netflix, Prime)" style="width: 100%; margin-bottom: 5px; padding: 5px; box-sizing: border-box;">
          <div style="display: flex; gap: 5px;">
            <button id="saveOverride" type="button" style="flex: 1;">Save</button>
            <button id="resetOverride" type="button" class="secondary" style="flex: 1;">Reset</button>
          </div>
        </div>
        <div class="actions" style="margin-top: 10px;">
          <button id="login" type="button">Connect Discord</button>
          <button id="logout" type="button">Disconnect</button>
        </div>
        <button id="clearPresence" class="secondary full" type="button">Clear Presence</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
